  BWA_MEM: BWA
  Bowtie2: Bowtie2
  Kraken2: Kraken2
  minimap2: minimap2
  HISAT2: HISAT2
  STAR: STAR
  samtools: samtools
  sort_SAM: samtools
  sort_BAM: samtools
  SAM2BAM: samtools
  BAM_stat: samtools
  BAM_not_in_BED: bedtools
  unmapped_to_fastq: samtools
  remove_read_pairs_mapped_to_host: samtools
