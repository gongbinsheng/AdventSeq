[project]
name = "adventseq"
version = "1.0.0"
description = "AdVentSeq: an HPC pipeline builder and viral quantification toolkit for sequencing data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysam>=0.23.3",
    "tqdm>=4.67.1",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["AdVentSeq"]
