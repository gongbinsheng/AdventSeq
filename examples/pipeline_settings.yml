# Pipeline settings for the AdventSeq example.
#
# The example driver (create_pipeline_script_example.py) passes every reference
# path explicitly, using the files prepared under examples/references/, so no
# reference_paths block is needed here.
#
# Optional: instead of passing paths in the driver script, you can define
# reference bundles keyed by ref_genome. BWA_MEM / featureCounts / GATK4_Mutect2
# then resolve them automatically. Paths must be ABSOLUTE, because the generated
# job scripts run inside each sample's own working directory.
#
# reference_paths:
#   hg38:
#     genome_fasta: /absolute/path/to/hg38/hg38.fa
#     bwa_index: /absolute/path/to/hg38/BWAIndex/genome.fa
#     gtf: /absolute/path/to/hg38/hg38.ncbiRefSeq.gtf
#
# When the config is loaded, AdventSeq checks that every conda env exists and
# appends a commented "AdventSeq tool versions" block to the end of this file.
