[project]
name = "adventseq"
version = "2.10.1"
description = "AdVentSeq: an HPC pipeline builder and viral quantification toolkit for sequencing data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysam>=0.23.3",
    "tqdm>=4.67.1",
    "pyyaml>=6.0.2",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
ViraQuant = "AdVentSeq.ViraQuant:main"
TaxonomyClassifier = "AdVentSeq.TaxonomyClassifier:main"
collect-results = "AdVentSeq.collect_results:main"
build-ncbi-taxonomy-map = "AdVentSeq.build_ncbi_taxonomy_map:main"
convert-ViraQuant-scan-to-ncbitaxon = "AdVentSeq.convert_ViraQuant_scan_to_ncbitaxon:main"
convert-rvdb-to-json = "AdVentSeq.convert_rvdb_to_json:main"
add-rvdb-columns = "AdVentSeq.add_rvdb_columns:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["AdVentSeq"]
